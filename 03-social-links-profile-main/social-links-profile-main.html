<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>social-links-profile</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="container">
        <div class="avatar-container">
            <img class="avatar" src="images/avatar-jessica.jpeg" alt="jessica randall">
        </div>
        <div class="name-and-country-container">
            <h1 class="name">Jessica Randall</h1>
            <p class="country">London, United Kingdom</p>
        </div>

        <p class="specialty"><q>Front-end developer and avid reader.</q></p>
        <div class="btn-div">
            <button class="btn" type="button">GitHub</button>
            <button class="btn" type="button">Frontend Mentor</button>
            <button class="btn" type="button">LinkedIn</button>
            <button class="btn" type="button">Twitter</button>
            <button class="btn" type="button">Instagram</button>
        </div>

    </main>
</body>

</html>
